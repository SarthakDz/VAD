# Every threshold, model name and window size lives here -- never in code.
data:
  root: "../Train and Test"
  cache_dir: "cache"
  out_dir: "outputs"

sampling:
  fps: 2.0
  max_frames_per_video: 4096

encoder:
  name: "google/siglip-base-patch16-224"
  # quality option, behind a flag: google/siglip-so400m-patch14-384
  batch_size: 64
  dtype: "float16"

head:
  hidden: 256
  layers: 2
  dropout: 0.2
  lr: 0.001
  epochs: 20
  batch_size: 16
  # 1551/2200 train events span their whole clip and carry no localisation
  # signal. Upweight the ~649 clips where start_time_sec > 0.
  localised_weight: 3.0

segments:
  enter_threshold: 0.70   # false alarms are expensive: any event on a normal L2/3 video scores 0
  exit_threshold: 0.45
  merge_gap_sec: 5.0      # fragments cannot double-match (trap 4): merge aggressively
  min_event_sec: 2.0

vlm:
  model: "Qwen/Qwen3-VL-4B-Instruct"
  frames_per_segment: 8
  max_new_tokens: 128
  motion_mask: false

seed: 1337

scoring:
  iou_gate: 0.5
  # ASSUMPTION -- official alert/matched/timing weights are unpublished.
  level2_weights: [0.2, 0.5, 0.3]
  level3_weights: [0.2, 0.4, 0.4]

submission:
  manifest: "data/manifest.json"   # download from the arena Benchmark tab
  max_file_mb: 5
  hardware: "1x RTX 4060 Laptop 8GB"
