# Every threshold, model name and window size lives here -- never in code.
data:
  root: "../Train and Test"
  cache_dir: "cache"
  out_dir: "outputs"

sampling:
  fps: 2.0
  max_frames_per_video: 4096

encoder:
  name: "google/siglip-base-patch16-224"
  # quality option, behind a flag: google/siglip-so400m-patch14-384
  batch_size: 64
  dtype: "float16"

head:
  hidden: 256
  layers: 2
  dropout: 0.2
  lr: 0.001
  epochs: 20
  batch_size: 16
  # 1551/2200 train events span their whole clip and carry no localisation
  # signal. Upweight the ~649 clips where start_time_sec > 0.
  localised_weight: 3.0

segments:
  enter_threshold: 0.60
  exit_threshold: 0.40
  merge_gap_sec: 2.0
  min_event_sec: 1.0

vlm:
  model: "Qwen/Qwen3-VL-4B-Instruct"
  frames_per_segment: 8
  max_new_tokens: 128
  motion_mask: false

seed: 1337
